name: ci

on:
  push:
    branches: [master, v2]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc-13,    cxx: g++-13,     pkg: g++-13 }
          - { cc: clang-18,  cxx: clang++-18, pkg: clang-18 }

    steps:
      - uses: actions/checkout@v4

      - name: Install ${{ matrix.compiler.pkg }} + cmake
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler.pkg }} cmake ninja-build

      - name: Configure
        env:
          CC:  ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Install (smoke test)
        run: |
          cmake --install build --prefix ${{ runner.temp }}/cpuaff-install
          test -d ${{ runner.temp }}/cpuaff-install/include/cpuaff
          test -f ${{ runner.temp }}/cpuaff-install/lib/cmake/cpuaff/cpuaffConfig.cmake
          test -f ${{ runner.temp }}/cpuaff-install/lib/pkgconfig/cpuaff.pc
