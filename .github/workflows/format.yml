name: format

on:
  push:
    branches: [master, v2]
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pin to clang-format-21 from apt.llvm.org so the CI gate is
      # reproducible across LLVM upstream changes and matches what
      # current Fedora ships (clang-format-21 in F43+). Pre-commit
      # users on other systems can install the same version via the
      # LLVM downloads.
      - name: Install clang-format-21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/apt.llvm.org.gpg
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-21
          clang-format-21 --version

      - name: Check formatting
        run: |
          mapfile -d '' files < <(
            find include examples tests \
              -type f \( -name '*.hpp' -o -name '*.cpp' -o -name '*.inl' \) \
              ! -path 'tests/catch.hpp' \
              -print0
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no source files found"; exit 1
          fi
          clang-format-21 --dry-run --Werror --style=file "${files[@]}"
